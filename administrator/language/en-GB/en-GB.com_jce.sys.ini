COM_JCE="JCE Editor"
COM_JCE_INSTALL_GUEST_PROFILES_UNPUBLISHED="%1$s editor profile(s) have been turned off because they gave the editor to visitors who are not logged in, and to no one else: %2$s. If this is what you want, enable <a href='https://www.joomlacontenteditor.net/support/faq/editor/allow-guest-access' target='_blank' rel='noopener' title='Read more about Allow Guest Access'>Allow Guest Access</a>, then publish the profiles again. If you do not recognise these profiles, please check them before publishing, as they may have been added by someone else."
COM_JCE_INSTALL_GUEST_PROFILES_MODIFIED="The Public or Guest user group has been removed from %1$s editor profile(s): %2$s. These profiles still apply to their other user groups and have been left switched on. To give the editor to visitors who are not logged in, enable <a href='https://www.joomlacontenteditor.net/support/faq/editor/allow-guest-access' target='_blank' rel='noopener' title='Read more about Allow Guest Access'>Allow Guest Access</a> and add the group back."
COM_JCE_INSTALL_GUEST_PROFILES_UNPUBLISHED_MORE="%1$s and %2$s more"
COM_JCE_XML_DESCRIPTION="<p>JCE is a WYSIWYG Editor Extension for Joomla.</p><p>JCE would not exist without these great projects:<br /><ul><li><a href='http://www.joomla.org' target='_blank'>Joomla!</a></li><li><a href='https://tinymce.com' target='_blank'>TinyMCE</a></li><li><a href='https://jquery.com' target='_blank'>JQuery</a></li><li><a href='https://getuikit.com/' target='_blank'>UIKit</a></li><li>Font Icons by <a href='https://icomoon.io/'>IcoMoon.</a></li><li>Fugue Icons Copyright © <a href='http://p.yusukekamiyamane.com/'>Yusuke Kamiyamane.</a> All rights reserved.</li></ul></p><p>JCE is dedicated to my father.</p><p>For a full changelog see <a target='_blank' href='https://www.joomlacontenteditor.net/support/changelog/editor'>https://www.joomlacontenteditor.net/support/changelog/editor</a></p>"

